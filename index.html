<!DOCTYPE html>
<html lang="it" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Value Desk - Tennis Betting Analysis</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur sticky top-0 z-50 px-4 py-3 flex justify-between items-center">
        <h1 class="text-lg font-bold tracking-wider text-emerald-400">VALUE DESK</h1>
        <span class="text-xs text-slate-400 bg-slate-800 px-2 py-1 rounded">Live Client-Side</span>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-4xl w-full mx-auto p-4 space-y-6">
        
        <!-- Sezione Palinsesto -->
        <section class="bg-slate-900/80 border border-slate-800 rounded-xl p-4 shadow-lg">
            <h2 class="text-md font-semibold text-slate-200 mb-3 border-b border-slate-800 pb-2">📅 Tutte le Partite (Palinsesto)</h2>
            <ul id="matches" class="space-y-2 text-sm text-slate-300">
                <!-- Verrà popolato da JS -->
            </ul>
        </section>

        <!-- Sezione Occasioni -->
        <section class="bg-slate-900/80 border border-slate-800 rounded-xl p-4 shadow-lg">
            <h2 class="text-md font-semibold text-emerald-400 mb-3 border-b border-slate-800 pb-2">🎯 Occasioni di Valore</h2>
            <ul id="opportunities" class="space-y-2 text-sm text-slate-300">
                <li class="text-slate-500 italic">Nessuna occasione disponibile al momento.</li>
            </ul>
        </section>

    </main>

    <!-- Script di Logica Pulito -->
    <script>
        const matchesData = [
            { date: '2026-09-24', time: '15:30', opponent: 'John Doe' },
            { date: '2026-09-25', time: '18:00', opponent: 'Jane Smith' }
        ];

        function renderMatches() {
            const matchesList = document.getElementById('matches');
            matchesList.innerHTML = '';

            if (matchesData.length === 0) {
                matchesList.innerHTML = '<li class="text-slate-500 italic">Dato non disponibile</li>';
                return;
            }

            matchesData.forEach(match => {
                const li = document.createElement('li');
                li.className = "bg-slate-800/50 p-2.5 rounded-lg border border-slate-700/50 flex justify-between items-center";
                li.innerHTML = `
                    <div><span class="font-medium text-white">${match.opponent}</span></div>
                    <div class="text-xs text-emerald-400 font-mono">${match.date} - ${match.time}</div>
                `;
                matchesList.appendChild(li);
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderMatches();
        });
    </script>
</body>
</html>
