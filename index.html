<script>
function getMatches() {
    var matches = [
        {date: '2026-09-24', time: '15:30', opponent: 'John Doe'},
        {date: '2026-09-25', time: '18:00', opponent: 'Jane Smith'}
    ];

    var matchesList = document.getElementById('matches');
    for (var i = 0; i < matches.length; i++) {
        var match = matches[i];
        var li = document.createElement('li');
        li.textContent = 'Data: ' + match.date + ', Ora: ' + match.time + ', Avversario: ' + match.opponent;
        matchesList.appendChild(li);
    }
}

function updateMatches() {
    var now = new Date();
    var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    var tomorrow = new Date(today); tomorrow.setDate(tomorrow.getDate() + 1);

    var matchesList = document.getElementById('matches');
    while (matchesList.firstChild) {
        matchesList.removeChild(matchesList.firstChild);
    }

    for (var i = today; i <= tomorrow; i++) {
        getMatches();
    }
}
