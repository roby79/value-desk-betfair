<!DOCTYPE html>
<html lang="it" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Value Desk - Tennis Betting Analysis</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur sticky top-0 z-50 px-4 py-3 flex justify-between items-center">
        <h1 class="text-lg font-bold tracking-wider text-emerald-400">VALUE DESK</h1>
        <span class="text-xs text-slate-400 bg-slate-800 px-2 py-1 rounded">Live Client-Side</span>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-4xl w-full mx-auto p-4 space-y-6">
        
        <!-- Sezione Palinsesto -->
        <section class="bg-slate-900/80 border border-slate-800 rounded-xl p-4 shadow-lg">
            <div class="flex justify-between items-center mb-3 border-b border-slate-800 pb-2">
                <h2 class="text-md font-semibold text-slate-200">📅 Tutte le Partite (Palinsesto)</h2>
                <span id="match-count" class="text-xs bg-slate-800 text-slate-400 px-2 py-0.5 rounded-full">0 match</span>
            </div>
            <div id="matches-container" class="space-y-3">
                <!-- Verrà popolato da JS -->
            </div>
        </section>

        <!-- Sezione Occasioni -->
        <section class="bg-slate-900/80 border border-slate-800 rounded-xl p-4 shadow-lg">
            <h2 class="text-md font-semibold text-emerald-400 mb-3 border-b border-slate-800 pb-2">🎯 Occasioni di Valore (Value Bets)</h2>
            <div id="opportunities-container" class="space-y-2">
                <div class="text-slate-500 italic text-sm">Nessuna occasione attiva al momento. Analisi in corso...</div>
            </div>
        </section>

    </main>

    <!-- Script di Logica Palinsesto -->
    <script>
        // Dati di esempio realistici per il tennis
        const matchesData = [
            {
                tournament: "ATP US Open",
                time: "17:30",
                player1: "J. Sinner",
                player2: "C. Alcaraz",
                odds1: 1.85,
                odds2: 2.05
            },
            {
                tournament: "WTA Beijing",
                time: "19:00",
                player1: "I. Swiatek",
                player2: "A. Sabalenka",
                odds1: 1.55,
                odds2: 2.45
            },
            {
                tournament: "ATP Challenger Roma",
                time: "21:15",
                player1: "F. Cobolli",
                player2: "L. Nardi",
                odds1: 1.70,
                odds2: 2.15
            }
        ];

        function renderPalinsesto() {
            const container = document.getElementById('matches-container');
            const countBadge = document.getElementById('match-count');
            container.innerHTML = '';
            
            countBadge.textContent = `${matchesData.length} match`;

            if (matchesData.length === 0) {
                container.innerHTML = '<div class="text-slate-500 italic text-sm">Nessuna partita disponibile oggi.</div>';
                return;
            }

            matchesData.forEach(match => {
                const card = document.createElement('div');
                card.className = "bg-slate-800/40 border border-slate-700/50 rounded-lg p-3 hover:border-slate-600 transition";
                card.innerHTML = `
                    <div class="flex justify-between items-center text-xs text-slate-400 mb-2">
                        <span class="font-medium text-emerald-500">${match.tournament}</span>
                        <span class="font-mono bg-slate-800 px-2 py-0.5 rounded">${match.time} CET</span>
                    </div>
                    <div class="flex justify-between items-center text-sm font-medium">
                        <div class="space-y-1">
                            <div>${match.player1}</div>
                            <div class="text-slate-400">${match.player2}</div>
                        </div>
                        <div class="flex gap-2 text-xs font-mono">
                            <span class="bg-slate-900 border border-slate-700 px-2 py-1 rounded text-slate-300">1: <strong>${match.odds1}</strong></span>
                            <span class="bg-slate-900 border border-slate-700 px-2 py-1 rounded text-slate-300">2: <strong>${match.odds2}</strong></span>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderPalinsesto();
        });
    </script>
</body>
</html>
