<!-- Script con Motore Pro v2.1 (Calibrazione e Smorzamento Realistico) -->
    <script>
        let matchesData = [
            {
                id: 101,
                tournament: "ATP Masters Shanghai",
                tier: "ATP 1000",
                surface: "hard",
                time: "14:00 CET",
                player1: "J. Menesch",
                rank1: 35,
                odds1: 2.10, // Quota leggermente ritoccata per test realistico
                eloOverall1: 1850,
                eloSurface1: 1865,
                eloRecent1: 1860,
                surfaceMatchesCount1: 22,
                sosRecent1: 45,
                gameWinAvg1: 52.0, // Valori realistici vicini al 50%
                form1: ["V", "V", "S", "V"],
                player2: "T. Etcheverry",
                rank2: 32,
                odds2: 1.80,
                eloOverall2: 1860,
                eloSurface2: 1855,
                eloRecent2: 1858,
                surfaceMatchesCount2: 18,
                sosRecent2: 48,
                gameWinAvg2: 50.5,
                form2: ["V", "S", "V", "S"]
            },
            {
                id: 102,
                tournament: "WTA Wuhan",
                tier: "WTA 1000",
                surface: "hard_indoor",
                time: "16:30 CET",
                player1: "M. Andreeva",
                rank1: 15,
                odds1: 1.72,
                eloOverall1: 1900,
                eloSurface1: 1920,
                eloRecent1: 1910,
                surfaceMatchesCount1: 12,
                sosRecent1: 38,
                gameWinAvg1: 53.5,
                form1: ["V", "V", "V", "S"],
                player2: "L. Fernandez",
                rank2: 28,
                odds2: 2.15,
                eloOverall2: 1840,
                eloSurface2: 1820,
                eloRecent2: 1830,
                surfaceMatchesCount2: 10,
                sosRecent2: 42,
                gameWinAvg2: 49.0,
                form2: ["V", "S", "V", "S"]
            }
        ];

        let placedBets = [];
        let activeBetContext = null;

        function switchTab(tab) {
            document.getElementById('tab-palinsesto').classList.toggle('hidden', tab !== 'palinsesto');
            document.getElementById('tab-occasioni').classList.toggle('hidden', tab !== 'occasioni');
            document.getElementById('tab-giocate').classList.toggle('hidden', tab !== 'giocate');
            
            document.getElementById('btn-palinsesto').className = tab === 'palinsesto' ? 'px-3 py-1 text-xs font-medium rounded-lg bg-emerald-500 text-slate-950 transition' : 'px-3 py-1 text-xs font-medium rounded-lg bg-slate-800 text-slate-300 transition';
            document.getElementById('btn-occasioni').className = tab === 'occasioni' ? 'px-3 py-1 text-xs font-medium rounded-lg bg-emerald-500 text-slate-950 transition' : 'px-3 py-1 text-xs font-medium rounded-lg bg-slate-800 text-slate-300 transition';
            document.getElementById('btn-giocate').className = tab === 'giocate' ? 'px-3 py-1 text-xs font-medium rounded-lg bg-emerald-500 text-slate-950 transition' : 'px-3 py-1 text-xs font-medium rounded-lg bg-slate-800 text-slate-300 transition';
        }

        function getEffectiveElo(surfaceElo, overallElo, recentElo, surfaceCount) {
            let w_surface = 0.50, w_overall = 0.30, w_recent = 0.20;
            if (surfaceCount < 5) {
                w_surface = 0.20; w_overall = 0.60; w_recent = 0.20; // Shrinkage se pochi dati
            }
            return (w_surface * surfaceElo) + (w_overall * overallElo) + (w_recent * recentElo);
        }

        function calculateConfidenceScore(surfaceCount, gameWinAvg, tier) {
            let score = 70;
            if (surfaceCount < 5) score -= 15;
            else if (surfaceCount >= 15) score += 10;
            if (tier.includes('1000') || tier.includes('Slam')) score += 5;
            return Math.min(Math.max(score, 40), 95);
        }

        function getNetOdds(odds) {
            const netProfit = (odds - 1) * 0.95; // Commissione 5% Betfair
            return 1 + netProfit;
        }

        function processMatches() {
            return matchesData.map(match => {
                const effElo1 = getEffectiveElo(match.eloSurface1, match.eloOverall1, match.eloRecent1, match.surfaceMatchesCount1);
                const effElo2 = getEffectiveElo(match.eloSurface2, match.eloOverall2, match.eloRecent2, match.surfaceMatchesCount2);

                // Differenza Elo pura
                const eloDiff = effElo1 - effElo2;

                // Aggiunta controllata dell'efficienza sui game (smorzata per evitare percentuali folli)
                const gameDiff = (match.gameWinAvg1 - match.gameWinAvg2) * 2.5; 
                const totalScoreDiff = eloDiff + gameDiff;

                // Conversione in probabilità con fattore di scala professionale (400 standard, diviso per smorzare estremi)
                const rawProb1 = 1 / (1 + Math.pow(10, -totalScoreDiff / 450));
                
                // Applicazione di un ulteriore shrinkage verso il 50% (evita overconfidence del modello)
                const damping = 0.85; 
                const probElo1 = 0.5 + (rawProb1 - 0.5) * damping;
                const probElo2 = 1 - probElo1;

                const netOdds1 = getNetOdds(match.odds1);
                const netOdds2 = getNetOdds(match.odds2);
                const rawMarket1 = 1 / netOdds1;
                const rawMarket2 = 1 / netOdds2;
                const marketNoVig1 = rawMarket1 / (rawMarket1 + rawMarket2);
                const marketNoVig2 = rawMarket2 / (rawMarket1 + rawMarket2);

                const netEdge1 = probElo1 - marketNoVig1;
                const netEdge2 = probElo2 - marketNoVig2;

                const netEv1 = probElo1 * (netOdds1 - 1) * 0.95 - (1 - probElo1);
                const netEv2 = probElo2 * (netOdds2 - 1) * 0.95 - (1 - probElo2);

                const confidence1 = calculateConfidenceScore(match.surfaceMatchesCount1, match.gameWinAvg1, match.tier);
                const confidence2 = calculateConfidenceScore(match.surfaceMatchesCount2, match.gameWinAvg2, match.tier);

                let valueOn = null;
                let bestEv = 0;
                let recommendedSide = "";
                let recommendedOdds = 0;

                if (netEv1 >= 0.03 && netEdge1 >= 0.02 && confidence1 >= 65) {
                    valueOn = match.player1;
                    bestEv = (netEv1 * 100).toFixed(1);
                    recommendedSide = `Punta ${match.player1}`;
                    recommendedOdds = match.odds1;
                } else if (netEv2 >= 0.03 && netEdge2 >= 0.02 && confidence2 >= 65) {
                    valueOn = match.player2;
                    bestEv = (netEv2 * 100).toFixed(1);
                    recommendedSide = `Punta ${match.player2}`;
                    recommendedOdds = match.odds2;
                }

                return {
                    ...match,
                    probElo1: (probElo1 * 100).toFixed(1),
                    probElo2: (probElo2 * 100).toFixed(1),
                    netOdds1: netOdds1.toFixed(2),
                    netOdds2: netOdds2.toFixed(2),
                    netEv1: (netEv1 * 100).toFixed(1),
                    netEv2: (netEv2 * 100).toFixed(1),
                    confidence1,
                    confidence2,
                    valueOn,
                    bestEv: bestEv > 0 ? `+${bestEv}% EV` : null,
                    recommendedSide,
                    recommendedOdds
                };
            });
        }

        function openBetModal(matchId, sideText, defaultOdds) {
            const match = matchesData.find(m => m.id === matchId);
            if (!match) return;
            activeBetContext = { matchId, sideText };
            document.getElementById('modal-match-info').textContent = `${match.tournament} [${match.surface}] (${match.time}): ${match.player1} vs ${match.player2}`;
            document.getElementById('modal-side').value = sideText;
            document.getElementById('modal-odds').value = defaultOdds;
            document.getElementById('bet-modal').classList.remove('hidden');
        }

        function closeBetModal() {
            document.getElementById('bet-modal').classList.add('hidden');
            activeBetContext = null;
        }

        function confirmBet() {
            if (!activeBetContext) return;
            const match = matchesData.find(m => m.id === activeBetContext.matchId);
            const odds = parseFloat(document.getElementById('modal-odds').value);
            const stake = parseFloat(document.getElementById('modal-stake').value);
            if (!odds || odds <= 1 || !stake || stake <= 0) {
                alert("Inserisci quota e stake validi.");
                return;
            }
            placedBets.push({
                id: Date.now(),
                match: `${match.player1} vs ${match.player2} (${match.surface})`,
                side: activeBetContext.sideText,
                odds: odds,
                stake: stake,
                status: 'In Corso',
                pnl: 0
            });
            closeBetModal();
            switchTab('giocate');
            updateGiocateTab();
        }

        function updateMatchStatus(betId, newStatus) {
            const target = placedBets.find(b => b.id === betId);
            if (!target) return;
            target.status = newStatus;
            if (newStatus === 'Vinta') {
                const grossProfit = target.stake * (target.odds - 1);
                target.pnl = grossProfit * 0.95;
            } else if (newStatus === 'Persa') {
                target.pnl = -target.stake;
            } else {
                target.pnl = 0;
            }
            updateGiocateTab();
        }

        function updateGiocateTab() {
            const tbody = document.getElementById('bets-table-body');
            document.getElementById('stats-total').textContent = placedBets.length;
            const totalStake = placedBets.reduce((acc, b) => acc + b.stake, 0);
            const totalPnL = placedBets.reduce((acc, b) => acc + b.pnl, 0);
            const roi = totalStake > 0 ? (totalPnL / totalStake) * 100 : 0;
            document.getElementById('stats-stake').textContent = `€${totalStake.toFixed(2)}`;
            const plElem = document.getElementById('stats-pl');
            plElem.textContent = `€${totalPnL.toFixed(2)}`;
            plElem.className = `text-lg font-bold font-mono ${totalPnL >= 0 ? 'text-emerald-400' : 'text-red-400'}`;
            const roiElem = document.getElementById('stats-roi');
            roiElem.textContent = `${roi.toFixed(2)}%`;
            roiElem.className = `text-lg font-bold font-mono ${roi >= 0 ? 'text-emerald-400' : 'text-red-400'}`;
            if (placedBets.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="py-4 text-center text-slate-500 italic">Nessuna giocata registrata.</td></tr>`;
                return;
            }
            tbody.innerHTML = placedBets.map(b => `
                <tr class="border-b border-slate-800/50 hover:bg-slate-900/40">
                    <td class="py-2.5">${b.match}</td>
                    <td class="py-2.5 text-emerald-400">${b.side}</td>
                    <td class="py-2.5 font-bold">€${b.odds.toFixed(2)}</td>
                    <td class="py-2.5">€${b.stake.toFixed(2)}</td>
                    <td class="py-2.5">
                        <select onchange="updateMatchStatus(${b.id}, this.value)" class="bg-slate-900 border border-slate-700 text-xs rounded px-1.5 py-0.5 text-slate-200">
                            <option value="In Corso" ${b.status === 'In Corso' ? 'selected' : ''}>In Corso</option>
                            <option value="Vinta" ${b.status === 'Vinta' ? 'selected' : ''}>Vinta</option>
                            <option value="Persa" ${b.status === 'Persa' ? 'selected' : ''}>Persa</option>
                        </select>
                    </td>
                    <td class="py-2.5 font-bold ${b.pnl >= 0 ? 'text-emerald-400' : 'text-red-400'}">€${b.pnl.toFixed(2)}</td>
                </tr>
            `).join('');
        }

        function renderApp(filterText = "") {
            const matchesContainer = document.getElementById('matches-container');
            const oppContainer = document.getElementById('opportunities-container');
            const matchCount = document.getElementById('match-count');
            const oppCount = document.getElementById('opp-count');

            matchesContainer.innerHTML = '';
            oppContainer.innerHTML = '';

            const processed = processMatches();
            const query = filterText.toLowerCase();
            const filteredData = processed.filter(m => 
                m.player1.toLowerCase().includes(query) || 
                m.player2.toLowerCase().includes(query) || 
                m.tournament.toLowerCase().includes(query) ||
                m.surface.toLowerCase().includes(query)
            );

            matchCount.textContent = `${filteredData.length} match`;
            const opportunities = filteredData.filter(m => m.valueOn !== null);
            oppCount.textContent = `${opportunities.length} opportunità`;

            if (opportunities.length === 0) {
                oppContainer.innerHTML = '<div class="text-slate-500 italic text-sm py-2">Nessuna occasione con Net EV >= 3% e Confidence >= 65.</div>';
            } else {
                opportunities.forEach(match => {
                    const card = document.createElement('div');
                    card.className = "bg-emerald-950/20 border border-emerald-500/40 rounded-xl p-4 space-y-3";
                    card.innerHTML = `
                        <div class="flex justify-between items-center text-xs text-slate-400">
                            <span class="font-medium text-emerald-400">${match.tournament} <span class="text-slate-300">[${match.surface}]</span> <strong class="text-white font-mono ml-1">(${match.time})</strong></span>
                            <span class="font-mono bg-emerald-900/40 text-emerald-300 px-2 py-0.5 rounded font-bold">${match.bestEv} (Net EV)</span>
                        </div>
                        <div class="flex justify-between items-center text-sm">
                            <div>
                                <strong class="text-white">🎯 Pro Pick su: <span class="text-emerald-300">${match.valueOn}</span></strong>
                                <div class="text-xs text-slate-400 mt-1">${match.player1} (${match.odds1}) vs ${match.player2} (${match.odds2})</div>
                            </div>
                            <button onclick="openBetModal(${match.id}, 'Punta ${match.valueOn}', ${match.valueOn === match.player1 ? match.odds1 : match.odds2})" class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold px-3 py-1.5 rounded-lg text-xs transition">Gioca</button>
                        </div>
                    `;
                    oppContainer.appendChild(card);
                });
            }

            filteredData.forEach(match => {
                const isVal1 = parseFloat(match.netEv1) >= 3.0 && match.confidence1 >= 65;
                const isVal2 = parseFloat(match.netEv2) >= 3.0 && match.confidence2 >= 65;

                const badge1 = isVal1 
                    ? `<span class="bg-emerald-950 text-emerald-400 border border-emerald-800 px-2 py-0.5 rounded text-xs font-mono font-bold">🟢 EV: +${match.netEv1}%</span>` 
                    : `<span class="bg-red-950/40 text-red-400 border border-red-900/50 px-2 py-0.5 rounded text-xs font-mono">🔴 No Bet (EV: ${match.netEv1}%)</span>`;

                const badge2 = isVal2 
                    ? `<span class="bg-emerald-950 text-emerald-400 border border-emerald-800 px-2 py-0.5 rounded text-xs font-mono font-bold">🟢 EV: +${match.netEv2}%</span>` 
                    : `<span class="bg-red-950/40 text-red-400 border border-red-900/50 px-2 py-0.5 rounded text-xs font-mono">🔴 No Bet (EV: ${match.netEv2}%)</span>`;

                const card = document.createElement('div');
                card.className = "bg-slate-800/40 border border-slate-700/50 rounded-xl p-4 space-y-3";
                card.innerHTML = `
                    <div class="flex justify-between items-center text-xs text-slate-400">
                        <span class="font-medium text-slate-300">${match.tournament} (${match.tier}) <span class="text-emerald-400 font-semibold ml-1">⚡ ${match.surface}</span></span>
                        <span class="font-mono bg-slate-800 px-2 py-0.5 rounded text-slate-300">${match.time}</span>
                    </div>
                    
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-sm bg-slate-900/60 p-3 rounded-lg border border-slate-800 items-center">
                        <div class="flex flex-col justify-between space-y-2 sm:border-r sm:border-slate-800 sm:pr-3">
                            <div class="flex justify-between items-start">
                                <div>
                                    <div class="font-bold text-white">${match.player1} <span class="text-xs text-slate-400 font-normal">(Rank ${match.rank1})</span> <span class="font-mono text-emerald-400 text-xs ml-1">(Q. ${match.odds1})</span></div>
                                    <div class="text-xs text-slate-400 mt-0.5">Conf: <span class="font-mono text-emerald-300">${match.confidence1}/100</span> | SOS: <span class="font-mono text-slate-200">${match.sosRecent1 || 45}</span></div>
                                </div>
                                <div>${badge1}</div>
                            </div>
                            <div class="flex justify-between items-center pt-1 border-t border-slate-800/60 text-xs">
                                <span class="text-slate-400 font-mono">Model Prob: <strong class="text-slate-200">${match.probElo1}%</strong></span>
                                <button onclick="openBetModal(${match.id}, 'Punta ${match.player1}', ${match.odds1})" class="bg-slate-800 hover:bg-slate-700 text-emerald-400 text-xs px-2.5 py-1 rounded font-mono">Punta</button>
                            </div>
                        </div>

                        <div class="flex flex-col justify-between space-y-2 sm:pl-3">
                            <div class="flex justify-between items-start">
                                <div>
                                    <div class="font-bold text-white">${match.player2} <span class="text-xs text-slate-400 font-normal">(Rank ${match.rank2})</span> <span class="font-mono text-emerald-400 text-xs ml-1">(Q. ${match.odds2})</span></div>
                                    <div class="text-xs text-slate-400 mt-0.5">Conf: <span class="font-mono text-emerald-300">${match.confidence2}/100</span> | SOS: <span class="font-mono text-slate-200">${match.sosRecent2 || 48}</span></div>
                                </div>
                                <div>${badge2}</div>
                            </div>
                            <div class="flex justify-between items-center pt-1 border-t border-slate-800/60 text-xs">
                                <span class="text-slate-400 font-mono">Model Prob: <strong class="text-slate-200">${match.probElo2}%</strong></span>
                                <button onclick="openBetModal(${match.id}, 'Punta ${match.player2}', ${match.odds2})" class="bg-slate-800 hover:bg-slate-700 text-emerald-400 text-xs px-2.5 py-1 rounded font-mono">Punta</button>
                            </div>
                        </div>
                    </div>
                `;
                matchesContainer.appendChild(card);
            });
        }

        document.getElementById('search-input').addEventListener('input', (e) => {
            renderApp(e.target.value);
        });

        document.addEventListener('DOMContentLoaded', () => {
            renderApp();
        });
    </script>
